<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24130d">
<title>Paraluman, Tahanan, Mahika &amp; Binibini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@400;500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4526"/><stop offset="1" stop-color="#4f301a"/></linearGradient>
<linearGradient id="gSideL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bb8c5d"/><stop offset="1" stop-color="#a07245"/></linearGradient>
<linearGradient id="gSideR" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b08050"/><stop offset="1" stop-color="#946840"/></linearGradient>
<linearGradient id="gBot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#a97b4b"/><stop offset="1" stop-color="#c79a67"/></linearGradient>
<linearGradient id="gFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfa272"/><stop offset="1" stop-color="#a77849"/></linearGradient>
<radialGradient id="stain"><stop offset="0" stop-color="#5a3216" stop-opacity=".35"/><stop offset="1" stop-color="#5a3216" stop-opacity="0"/></radialGradient>
<pattern id="fib" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><path d="M0 0V7" stroke="#3d2412" stroke-opacity=".07" stroke-width="1"/><path d="M3.5 0V4" stroke="#f0d2a6" stroke-opacity=".07" stroke-width="1"/></pattern>
<clipPath id="cpFront"><path d="M0 0L145 110L0 200Z"/><path d="M290 0L145 110L290 200Z"/><path d="M0 200L145 100L290 200Z"/></clipPath>
<clipPath id="cpFlap"><path d="M0 0H290L145 118Z"/></clipPath>
</defs></svg>
<div class="bgwrap"><div class="bg" id="bg"></div><div class="bg" id="bg2"></div><div class="veil"></div></div>
<main id="app">
  <div class="stage">
    <div class="cover-wrap"><img class="cover" id="cover" alt="Album cover"></div>
    <div class="vinyl">
      <div class="disc" id="disc"><img class="label" id="label" alt=""><div class="hole"></div></div>
      <div class="shine"></div>
      <div class="arm"><div class="rod"></div><div class="head"></div><div class="pivot"></div></div>
    </div>
  </div>
  <div class="meta">
    <h1 id="title">Paraluman</h1>
    <p class="artist" id="artist">Adie</p>
    <p class="note" id="note"><span></span></p>
  </div>
  <div class="chips" id="chips"></div>
  <div class="controls">
    <canvas class="viz" id="viz" aria-hidden="true"></canvas>
    <div class="row">
      <button class="sk tr" id="prev" aria-label="Previous song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.25.66L9.5 12.66a.8.8 0 0 1 0-1.32l9.25-6.5A.8.8 0 0 1 20 5.5z"/></svg></button>
      <button class="sk" id="back" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v4.5h4.5"/></svg><b>10</b></button>
      <button class="play" id="play" aria-label="Play">
        <svg class="tri" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        <svg class="pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
      </button>
      <button class="sk" id="fwd" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg><b>10</b></button>
      <button class="sk tr" id="next" aria-label="Next song"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 5h-2v14h2zM4 5.5v13a.8.8 0 0 0 1.25.66l9.25-6.5a.8.8 0 0 0 0-1.32L5.25 4.84A.8.8 0 0 0 4 5.5z"/></svg></button>
    </div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><span id="dur">0:00</span></div>
  </div>
</main>

<button class="env" id="env" aria-label="Open the letter"><span class="ea">
<svg class="e-part back" viewBox="0 0 290 200" preserveAspectRatio="none"><rect width="290" height="200" rx="6" fill="url(#gBack)"/></svg>

<svg class="e-part front" viewBox="0 0 290 200" preserveAspectRatio="none">
  <g clip-path="url(#cpFront)">
    <path d="M0 0L145 110L0 200Z" fill="url(#gSideL)"/><path d="M290 0L145 110L290 200Z" fill="url(#gSideR)"/>
    <path d="M0 200L145 100L290 200Z" fill="url(#gBot)"/>
    <rect width="290" height="200" fill="url(#fib)"/>
    <ellipse cx="40" cy="170" rx="46" ry="26" fill="url(#stain)"/><ellipse cx="250" cy="150" rx="40" ry="30" fill="url(#stain)"/><ellipse cx="150" cy="190" rx="60" ry="14" fill="url(#stain)"/>
  </g>
  <path d="M0 0L145 110L0 200M290 0L145 110L290 200M0 200L145 100L290 200" fill="none" stroke="#3d2412" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M14 189L145 108L276 189" fill="none" stroke="#3d2412" stroke-opacity=".45" stroke-width="1.1" stroke-dasharray="4 3"/>
  <g transform="translate(236 46) rotate(4)">
    <rect x="0" y="0" width="38" height="46" fill="#ead6b0" stroke="#ead6b0" stroke-width="3" stroke-dasharray="2.4 2.4"/>
    <rect x="4" y="4" width="30" height="38" fill="#7b4a2a"/><rect x="6.5" y="6.5" width="25" height="33" fill="none" stroke="#d8b484" stroke-width=".8"/>
    <circle cx="19" cy="20" r="8" fill="#c99a6b"/><text x="19" y="24" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="600" font-size="12" fill="#4a2a14">13</text>
    <path d="M9 36H29" stroke="#d8b484" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#2f1a0e" stroke-opacity=".55" stroke-width="1.1">
    <circle cx="214" cy="62" r="17"/><circle cx="214" cy="62" r="12.5" stroke-dasharray="2 2"/>
    <path d="M232 52q6-5 12 0t12 0t12 0M232 60q6-5 12 0t12 0t12 0M232 68q6-5 12 0t12 0t12 0"/>
  </g>
  <text x="145" y="168" text-anchor="middle" font-family="Caveat,cursive" font-weight="600" font-size="19" fill="#2c180b" fill-opacity=".85">para sa aking paraluman</text>
  <path d="M68 176Q145 182 222 175" fill="none" stroke="#2c180b" stroke-opacity=".35" stroke-width="1"/>
</svg>
<span class="e-part flap"><svg viewBox="0 0 290 118" preserveAspectRatio="none">
  <g clip-path="url(#cpFlap)"><path d="M0 0H290L145 118Z" fill="url(#gFlap)"/><rect width="290" height="118" fill="url(#fib)"/><ellipse cx="60" cy="20" rx="50" ry="20" fill="url(#stain)"/><rect class="shade" width="290" height="118" fill="#1a0d05"/></g>
  <path d="M0 0H290L145 118Z" fill="none" stroke="#3d2412" stroke-opacity=".6" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M16 6H274L145 104Z" fill="none" stroke="#3d2412" stroke-opacity=".4" stroke-width="1.1" stroke-dasharray="4 3" stroke-linejoin="round"/>
</svg><span class="seal"></span></span>
</span><span class="cap">for you po</span></button>
<div class="scene" id="scene" role="dialog" aria-modal="true" aria-label="Letter">
  <div class="scene-bg" id="sceneBg"></div>
  <button class="close" id="close" aria-label="Close letter">&times;</button>
  <div class="bigenv" id="bigenv"><div class="env3d"><span class="ea">
<svg class="e-part back" viewBox="0 0 290 200" preserveAspectRatio="none"><rect width="290" height="200" rx="6" fill="url(#gBack)"/></svg>
<div class="clip"><div class="letter"><div class="paper">
  <svg class="flourish" viewBox="0 0 200 14" fill="none" stroke="#6b4222" stroke-width="1" stroke-linecap="round"><path d="M10 7H84M116 7H190" opacity=".7"/><path d="M100 1l6 6-6 6-6-6z" fill="#6b4222" fill-opacity=".55"/><circle cx="88" cy="7" r="1.4" fill="#6b4222"/><circle cx="112" cy="7" r="1.4" fill="#6b4222"/></svg>
  <div class="photos">
    <figure class="ph a"><img alt="Us together" src="assets/images/letter-us.jpg"></figure>
    <figure class="ph b"><img alt="Photo of you" src="assets/images/letter-her.jpg"></figure>
  </div>
  <p class="msg">Happy 13th birthday po baby ko!! well.. napagisipan ko lang po gumawa nito cuz. why not?? hehe it reminds me of you po. you are my only paraluman🥰.</p>
  <p class="sign">-Justin</p>
</div></div></div>
<svg class="e-part front" viewBox="0 0 290 200" preserveAspectRatio="none">
  <g clip-path="url(#cpFront)">
    <path d="M0 0L145 110L0 200Z" fill="url(#gSideL)"/><path d="M290 0L145 110L290 200Z" fill="url(#gSideR)"/>
    <path d="M0 200L145 100L290 200Z" fill="url(#gBot)"/>
    <rect width="290" height="200" fill="url(#fib)"/>
    <ellipse cx="40" cy="170" rx="46" ry="26" fill="url(#stain)"/><ellipse cx="250" cy="150" rx="40" ry="30" fill="url(#stain)"/><ellipse cx="150" cy="190" rx="60" ry="14" fill="url(#stain)"/>
  </g>
  <path d="M0 0L145 110L0 200M290 0L145 110L290 200M0 200L145 100L290 200" fill="none" stroke="#3d2412" stroke-opacity=".55" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M14 189L145 108L276 189" fill="none" stroke="#3d2412" stroke-opacity=".45" stroke-width="1.1" stroke-dasharray="4 3"/>
  <g transform="translate(236 46) rotate(4)">
    <rect x="0" y="0" width="38" height="46" fill="#ead6b0" stroke="#ead6b0" stroke-width="3" stroke-dasharray="2.4 2.4"/>
    <rect x="4" y="4" width="30" height="38" fill="#7b4a2a"/><rect x="6.5" y="6.5" width="25" height="33" fill="none" stroke="#d8b484" stroke-width=".8"/>
    <circle cx="19" cy="20" r="8" fill="#c99a6b"/><text x="19" y="24" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="600" font-size="12" fill="#4a2a14">13</text>
    <path d="M9 36H29" stroke="#d8b484" stroke-width="1"/>
  </g>
  <g fill="none" stroke="#2f1a0e" stroke-opacity=".55" stroke-width="1.1">
    <circle cx="214" cy="62" r="17"/><circle cx="214" cy="62" r="12.5" stroke-dasharray="2 2"/>
    <path d="M232 52q6-5 12 0t12 0t12 0M232 60q6-5 12 0t12 0t12 0M232 68q6-5 12 0t12 0t12 0"/>
  </g>
  <text x="145" y="168" text-anchor="middle" font-family="Caveat,cursive" font-weight="600" font-size="19" fill="#2c180b" fill-opacity=".85">para sa aking paraluman</text>
  <path d="M68 176Q145 182 222 175" fill="none" stroke="#2c180b" stroke-opacity=".35" stroke-width="1"/>
</svg>
<span class="e-part flap"><svg viewBox="0 0 290 118" preserveAspectRatio="none">
  <g clip-path="url(#cpFlap)"><path d="M0 0H290L145 118Z" fill="url(#gFlap)"/><rect width="290" height="118" fill="url(#fib)"/><ellipse cx="60" cy="20" rx="50" ry="20" fill="url(#stain)"/><rect class="shade" width="290" height="118" fill="#1a0d05"/></g>
  <path d="M0 0H290L145 118Z" fill="none" stroke="#3d2412" stroke-opacity=".6" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M16 6H274L145 104Z" fill="none" stroke="#3d2412" stroke-opacity=".4" stroke-width="1.1" stroke-dasharray="4 3" stroke-linejoin="round"/>
</svg><span class="seal"></span></span>
</span></div></div>
</div>

<audio id="audio" preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
